name: Discover

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build console runner
        run: dotnet build console/ProxyNodeHub.Console.csproj -c Release --nologo
      - name: Assert known_repos.json was published
        run: test -s console/bin/Release/net8.0/known_repos.json
      - name: Discover
        run: dotnet console/bin/Release/net8.0/ProxyNodeHub.Console.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_COUNT: '10'
          INACTIVE_DAYS: '7'
          ANALYSIS_CONCURRENCY: '4'
      - name: Download mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSET_URL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -o '"browser_download_url": *"[^"]*linux-amd64-compatible[^"]*\.gz"' | head -1 | cut -d'"' -f4)
          if [ -z "$ASSET_URL" ]; then echo "找不到 mihomo 下载地址"; exit 1; fi
          curl -sL -o mihomo.gz "$ASSET_URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v
      - name: Check nodes (mihomo delay test)
        run: python3 .github/scripts/check.py --config out/clash.yaml --names out/node-names.json --out-dir out --mihomo ./mihomo --timeout 5000
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out data
          git diff --cached --quiet || git commit -m "discover: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
