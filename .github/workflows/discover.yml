name: Discover

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build console runner
        run: dotnet build console/ProxyNodeHub.Console.csproj -c Release --nologo
      - name: Assert known_repos.json was published
        run: test -s console/bin/Release/net8.0/known_repos.json
      - name: Discover
        run: dotnet console/bin/Release/net8.0/ProxyNodeHub.Console.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_COUNT: '10'
          INACTIVE_DAYS: '7'
          ANALYSIS_CONCURRENCY: '4'
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out data
          git diff --cached --quiet || git commit -m "discover: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
